<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rust for people who write C#. Ownership and borrowing, visualised." />
    <meta name="theme-color" content="#16191c" />
    <title>Unmanaged: Rust for people who write C#</title>
    <script>
      // Apply the saved theme before first paint.
      try {
        var t = JSON.parse(localStorage.getItem('unmanaged.v1') || '{}').theme;
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
