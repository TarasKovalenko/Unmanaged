name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  web:
    name: Web app (lint, types, tests, 100% coverage, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- src scripts tests

      - name: Type-check and build
        run: npm run build

      - name: Unit tests with coverage gate
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: coverage/web
          if-no-files-found: ignore

  content:
    name: Content (compile and run every Rust and C# example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Error messages in lessons are verbatim rustc output, so the version is pinned
      # to the one in src/content/meta.ts.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - name: Check content
        run: npm run check:content

      - name: Generated C# data is up to date
        run: |
          if ! git diff --exit-code src/content/generated/csharp.json; then
            echo "::error::src/content/generated/csharp.json is stale. Run npm run check:content and commit the result."
            exit 1
          fi

  runner:
    name: Code runner (tests, 100% line and branch coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs the suite in two Linux containers (with and without setsid) and merges coverage.
      - name: Tests with coverage gate
        run: runner.Tests/coverage.sh --linux-only

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-runner
          path: coverage/runner
          if-no-files-found: ignore

  docker:
    name: Docker images and sandbox smoke test
    runs-on: ubuntu-latest
    needs: [web, runner]
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up --build --detach

      - name: Wait for the runner behind nginx
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8000/api/info > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run Rust and C# through nginx
        run: |
          run() {
            curl --silent --fail http://localhost:8000/api/run \
              -H 'content-type: application/json' --data "$1"
          }
          run '{"language":"rust","code":"fn main() { println!(\"rust ok\"); }"}' | grep -q '"stdout":"rust ok\\n"'
          run '{"language":"csharp","code":"Console.WriteLine(\"csharp ok\");"}' | grep -q '"stdout":"csharp ok\\n"'

      - name: Programs cannot reach the internet
        run: |
          curl --silent --fail http://localhost:8000/api/run \
            -H 'content-type: application/json' \
            --data '{"language":"csharp","code":"try { using var h = new HttpClient { Timeout = TimeSpan.FromSeconds(3) }; await h.GetStringAsync(\"https://example.com\"); Console.WriteLine(\"reached\"); } catch (Exception) { Console.WriteLine(\"blocked\"); }"}' \
            | grep -q '"stdout":"blocked\\n"'

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
