# docker compose up --build   →   http://localhost:8000
#
# The runner executes arbitrary code submitted by visitors. It is isolated by:
#   - an internal network with no route to the internet (only nginx can reach it)
#   - a read-only root filesystem, with a size-limited /tmp for compilation
#   - all Linux capabilities dropped and no-new-privileges
#   - memory, CPU and process-count limits for the whole container
#   - per-process timeouts, CPU/file-size/process ulimits and output caps (in the app)
#   - per-IP rate limiting and a concurrency cap (in the app)
# For a public deployment, also run it under gVisor: uncomment `runtime: runsc`.

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - runner
    networks:
      - public
      - sandbox
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    # runtime: runsc
    networks:
      - sandbox
    environment:
      Runner__TrustForwardedHeaders: "true"
      # Binding config replaces array entries by index, so set both of appsettings.json's.
      Runner__AllowedOrigins__0: "http://localhost:8000"
      Runner__AllowedOrigins__1: "http://localhost:8000"
      Runner__RunTimeoutSeconds: "5"
      Runner__CompileTimeoutSeconds: "20"
      Runner__MemoryLimitMb: "256"
      Runner__MaxConcurrency: "2"
      Runner__RequestsPerMinute: "30"
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=536870912
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped

networks:
  public: {}
  sandbox:
    internal: true
